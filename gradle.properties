# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build only what is needed, in parallel, with a shared cache.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required by modern Android projects.
android.useAndroidX=true

# Only generate R class entries for resources declared in this module.
android.nonTransitiveRClass=true

# Kotlin code style used by the IDE formatter.
kotlin.code.style=official
